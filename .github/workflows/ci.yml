name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 零运行时/开发依赖且无 lockfile,跳过 install,直接跑测试与语法检查
      - name: Test
        run: npm test

      - name: Syntax check
        run: npm run check
